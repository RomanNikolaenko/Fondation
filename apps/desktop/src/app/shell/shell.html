<div class="shell">
  <aside class="sidebar">
    <div class="brand">{{ appName }}</div>
    <nav aria-label="Головна навігація">
      @for (item of nav; track item.path) {
      <a
        class="nav-link"
        [routerLink]="item.path"
        routerLinkActive="nav-link--active"
        [routerLinkActiveOptions]="{ exact: item.path === '' }"
      >
        <span>{{ item.label }}</span>
        @if (item.path === 'approvals' && store.pendingCount() > 0) {
        <span class="badge">{{ store.pendingCount() }}</span>
        }
      </a>
      }
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <span class="chip" [class]="'chip ' + stateClass()">{{ engineLabel() }}</span>
      <button
        type="button"
        class="theme"
        (click)="toggleTheme()"
        [attr.aria-label]="theme() === 'dark' ? 'Світла тема' : 'Темна тема'"
      >
        {{ theme() === 'dark' ? '☀' : '☾' }}
      </button>
    </header>

    <app-mode-banner />

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
