[workspace]
members = ["crates/*", "apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
tokio = { version = "1.54", features = ["full"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rust_decimal = { version = "1.43", features = ["serde-str", "maths"] }
rust_decimal_macros = "1.40"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "chrono",
  "migrate",
] }
toml = "1"
keyring = { version = "4", default-features = false, features = ["windows-native-keyring-store"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["trace"] }
tokio-tungstenite = "0.30"
futures = "0.3"
ts-rs = { version = "12", features = ["chrono-impl", "serde-json-impl"] }
insta = { version = "1.49", features = ["json"] }
wiremock = "0.6"
url = "2"
fs4 = "1"
dirs = "7"
clap = { version = "4", features = ["derive"] }
subtle = "2.6"
rand = "0.10"
winreg = "0.56"
tauri = "2"
tauri-build = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
